<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in</title>
    <link rel="stylesheet" href="res/css/style.css">
</head>

<body>

    <div class="container" >
        <header>
            <nav>
                <a href="index.html">Home</a>
                |
                <a href="addPost.html">Add Post</a>
                |
                <a href="login.html">Log In</a>
            </nav>
            <div class="profile" hidden>
                <button class="avatar" id="profileButton" type="button" aria-expanded="false"
                    aria-controls="profileMenu">
                    <img src="res/img/avatar.png" alt="avatar">
                </button>

                <div class="profile-menu" id="profileMenu" hidden>
                    <p class="profile-name">John Doe</p>
                    <p class="profile-email">john.doe@ut.ee</p>
                    <hr>
                    <a href="login.html">Logout</a>
                </div>
            </div>
        </header>

        <section>
            <div class="col-left-login"></div>

            <div class="col-mid-login">
                <p>Welcome to PostIt</p><br>
                <p class="p1">Create an account</p><br>
                <p>or</p><br>
                <p>Please log in</p>

                <form action="index.html">
                    <div class=" email-input">
                        <input type="email" placeholder="Email" required>
                    </div>

                    <div class="password-input">
                        <input type="password" id="password" placeholder="Password" required>
                    </div>

                    <div class="login-btn-wrapper">
                        <button type="submit" class="login-btn">Log in</button>
                    </div>
                </form>

                <div>
                    <p class="p1">Forgot password</p>
                </div>

            </div>

            <div class="col-right-login"></div>
        </section>

</body>

</html>
