<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Post</title>
    <link rel="stylesheet" href="res/css/style.css">
</head>

<body>

    <div class="container">
        <header>
            <nav>
                <a href="index.html">Home</a>
                |
                <a href="addPost.html">Add Post</a>
                
                <a href="login.html" hidden>Log In</a>
            </nav>
            <div class="profile">
                <button class="avatar" id="profileButton" type="button"
                    aria-expanded="false" aria-controls="profileMenu">
                    <img src="res/img/avatar.png" alt="avatar" >
                </button>

                <div class="profile-menu" id="profileMenu" hidden>
                    <p class="profile-name">John Doe</p>
                    <p class="profile-email">john.doe@ut.ee</p>
                    <hr>
                    <a href="login.html">Logout</a>
                </div>
            </div>
        </header>

        <main>
            <form class="post-form" action="index.html" method="get">
                <div class="field">
                    <label for="body">Post body</label>
                    <textarea id="body" name="body" placeholder="textarea" required></textarea>
                </div>

                <div class="field">
                    <label for="file">Select file</label>
                    <input id="file" name="file" type="file" accept="image/*">
                </div>

                <button type="submit" class="login-btn">Create post</button>
            </form>
        </main>
    </div>
<script type="text/javascript" src="src/js/script.js"></script>
</body>

</html>
